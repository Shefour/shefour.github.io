{% extends "layout.html" %}
{% block content %}
    <h1>{{ title }}</h1>
    <form action="{{ url_for('edit', id=tea['id']) }}" method="post" class="edit-form">
        {% include "_form.html" %}
        <input type="hidden" name="action" value="tea-edit">
        <input type="hidden" name="id" value="{{ tea['id'] }}">
    </form>

    <ul class="action-list">
        <li>
            <a href="{{ url_for('index') }}">Back to list</a></li>
        <li>
            <form action="{{ url_for('delete', id=tea['id']) }}" method="post">
                <input type="submit" value="Delete" onclick="return confirm('Are you sure?')">
                <input type="hidden" name="action" value="tea-delete">
                <input type="hidden" name="id" value="{{ tea['id'] }}">
            </form>
        </li>
    </ul>
{% endblock %}
