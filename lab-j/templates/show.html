{% extends "layout.html" %}
{% block content %}
    <h1>{{ tea['name'] }}</h1>
    <p><strong>Type:</strong> {{ tea['type'] }}</p>
    <article>
        {{ tea['description'] }}
    </article>

    <ul class="action-list">
        <li> <a href="{{ url_for('index') }}">Back to list</a></li>
        <li><a href="{{ url_for('edit', id=tea['id']) }}">Edit</a></li>
    </ul>
{% endblock %}
